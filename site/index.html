<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNILUMEN s.r.o.</title>
  <meta name="description" content="UNILUMEN s.r.o. – nové webové stránky se připravují.">
  <style>
    :root { color-scheme: light dark; --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141413; --fg: #f2f2ef; --muted: #a3a39d; } }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 0 16px;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: .08em; margin: 0 0 .5rem; }
    p { color: var(--muted); margin: 0; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <h1>UNILUMEN</h1>
    <p>Připravujeme nové webové stránky.</p>
  </main>
</body>
</html>
